<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sarita's Kitchen</title>
  <style>
    body { background-color: #1e1915; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; }
    h1 { color: #f5a623; text-align: center; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 30px; }
    .card { background-color: #2a241f; border-radius: 10px; padding: 15px; border: 1px solid #3d332b; text-align: center; }
    .price { color: #f5a623; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Sujan's Kitchen Menu</h1>
  <div class="menu-grid">
    <div class="card">
      <h3>Buff Steam Mo:Mo</h3>
      <div class="price">Rs. 120 – 170</div>
    </div>
    <div class="card">
      <h3>Chicken Steam Mo:Mo</h3>
      <div class="price">Rs. 170 – 220</div>
    </div>
    <div class="card">
      <h3>Buff / Chicken C-Mo:Mo</h3>
      <div class="price">Rs. 180 – 250</div>
    </div>
    <div class="card">
      <h3>Veg Chowmein</h3>
      <div class="price">Rs. 100 – 150</div>
    </div>
  </div>
</body>
</html>
