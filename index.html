<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sujan's Kitchen</title>
  <style>
    body { background-color: #1e1915; color: #fff; font-family: sans-serif; margin: 0; padding: 0; }
    
    .hero { position: relative; width: 100%; height: 280px; }
    .hero img { width: 100%; height: 100%; object-fit: cover; }
    .hero-title {
      position: absolute; bottom: 20px; left: 30px;
      font-size: 2.2rem; font-weight: bold; color: #fff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
    }
    
    .section-title {
      color: #f5a623; margin: 30px 20px 10px 20px;
      border-bottom: 2px solid #3d332b; padding-bottom: 8px;
    }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; padding: 20px;
    }
    .card {
      background-color: #2a241f; border-radius: 10px;
      overflow: hidden; border: 1px solid #3d332b;
      text-align: center; padding-bottom: 12px;
    }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card h3 { margin: 10px 0 5px 0; font-size: 1rem; }
    .price { color: #f5a623; font-weight: bold; font-size: 0.95rem; }
  </style>
</head>
<body>

  <!-- Restaurant Photo -->
  <div class="hero">
    <img src="pardis-restaurant-and-cafe-country-house-architecture_2.jpg" alt="Sujan's Kitchen">
    <div class="hero-title">Sujan's Kitchen</div>
  </div>

  <!-- Mo:Mo & Specials -->
  <h2 class="section-title">Mo:Mo & Pizza Specials</h2>
  <div class="grid">
    <div class="card">
      <img src="steam momo.jpg" alt="Steam Mo:Mo">
      <h3>Steam Mo:Mo</h3>
      <div class="price">Rs. 170 – 220</div>
    </div>
    <div class="card">
      <img src="buff momo.jpg" alt="Buff Mo:Mo">
      <h3>Buff Mo:Mo</h3>
      <div class="price">Rs. 120 – 170</div>
    </div>
    <div class="card">
      <img src="momo piza.jpg" alt="Momo Pizza">
      <h3>Momo Pizza</h3>
      <div class="price">Rs. 250 – 350</div>
    </div>
  </div>

  <!-- Beverages -->
  <h2 class="section-title">Cold Drinks</h2>
  <div class="grid">
    <div class="card">
      <img src="sprite in glass.jpg" alt="Sprite in Glass">
      <h3>Sprite</h3>
      <div class="price">Rs. 60 – 100</div>
    </div>
    <div class="card">
      <img src="fanta photo.jpg" alt="Fanta">
      <h3>Fanta</h3>
      <div class="price">Rs. 60 – 100</div>
    </div>
    <div class="card">
      <img src="images (1).jpg" alt="Cold Drink">
      <h3>Cold Beverage</h3>
      <div class="price">Rs. 60 – 100</div>
    </div>
  </div>

</body>
</html>
